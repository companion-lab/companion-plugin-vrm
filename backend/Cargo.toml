[package]
name = "vrm-backend"
version = "0.1.0"
description = "VRM avatar feature plugin backend for companion-tauri"
license = "MIT"
edition = "2021"

[lib]
name = "vrm_backend"
crate-type = ["cdylib"]

[dependencies]
companion-plugin-sdk = { path = "../../sdk/rust/companion-plugin-sdk" }
# Mirrors the dependency spec the host app uses in app/src-tauri/Cargo.toml;
# used for model/thumbnail payload encoding exactly as in plugins.rs.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
